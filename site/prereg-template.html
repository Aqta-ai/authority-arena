<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authority Arena Pre-registration</title>
<meta name="description" content="The pre-registration for Authority Arena: questions, measures, arms, tasks, analysis and every deviation, dated.">
<style>
  /* Plain research styling: system type, a neutral palette, one accent. The hosted page's design is not part
     of this repository. */
  :root {
    --desk: #F8FAFC; --paper: #FFFFFF; --ink: #0F172A; --ink-2: #475569; --ink-3: #64748B; --rule: #E2E8F0; --track: #F1F5F9; --teal: #2563EB; --teal-ink: #1D4ED8; --red: #DC2626; --red-ink: #B91C1C; --chip: #EFF6FF; --shadow: none; --hatch: #BFDBFE; --wash: #EFF6FF; --teal-wash: #EFF6FF; --red-wash: #FEF2F2; --code-bg: #F1F5F9; --code: #F1F5F9; --heat-0: #E0EDFF; --heat-1: #FDE2E2; --heat-2: #F9B4B4; --heat-3: #F07F7F; --heat-4: #D93D3D; --heat-5: #B91C1C; --heat-hi: #FFFFFF;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --desk: #0B1120; --paper: #0F172A; --ink: #E2E8F0; --ink-2: #94A3B8; --ink-3: #94A3B8; --rule: #1E293B; --track: #1E293B; --teal: #60A5FA; --teal-ink: #93C5FD; --red: #F87171; --red-ink: #FCA5A5; --chip: #172554; --shadow: none; --hatch: #1E3A8A; --wash: #172554; --teal-wash: #172554; --red-wash: #450A0A; --code-bg: #1E293B; --code: #1E293B; --heat-0: #172554; --heat-1: #3A1E26; --heat-2: #5B2530; --heat-3: #7F2D36; --heat-4: #A3363D; --heat-5: #BE3F47; --heat-hi: #E2E8F0; color-scheme: dark; } }
  :root[data-theme="dark"] { --desk: #0B1120; --paper: #0F172A; --ink: #E2E8F0; --ink-2: #94A3B8; --ink-3: #94A3B8; --rule: #1E293B; --track: #1E293B; --teal: #60A5FA; --teal-ink: #93C5FD; --red: #F87171; --red-ink: #FCA5A5; --chip: #172554; --shadow: none; --hatch: #1E3A8A; --wash: #172554; --teal-wash: #172554; --red-wash: #450A0A; --code-bg: #1E293B; --code: #1E293B; --heat-0: #172554; --heat-1: #3A1E26; --heat-2: #5B2530; --heat-3: #7F2D36; --heat-4: #A3363D; --heat-5: #BE3F47; --heat-hi: #E2E8F0; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 20px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 16px/1.65 var(--sans); }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 36px 20px 80px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; }
  main { min-width: 0; }
  a { color: var(--teal-ink); text-underline-offset: 2px; }
  .back { font: 600 .8125rem var(--mono); margin: 0 0 14px; }
  .toc { position: sticky; top: 24px; align-self: start; font-size: .875rem; padding-top: 34px; }
  .toc .t { font: 700 .6875rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px 12px; }
  .toc a { display: flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; padding: 5px 12px; border-left: 2px solid var(--rule); line-height: 1.35; }
  .toc a:hover { color: var(--ink); }
  .toc a.on { color: var(--teal-ink); border-left-color: var(--teal); font-weight: 600; }
  .toc .n { font: 700 .6875rem/1 var(--mono); background: var(--wash); color: var(--teal-ink); border-radius: 999px; padding: 3px 7px; }
  .doc { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 32px 36px; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.08; letter-spacing: -.025em; margin: 0 0 14px; text-wrap: balance; }
  h2 { font-size: 1.35rem; margin: 40px 0 10px; letter-spacing: -.01em; padding-top: 18px; border-top: 1px solid var(--rule); }
  h3 { font-size: 1.05rem; margin: 22px 0 6px; }
  p, li { color: var(--ink-2); overflow-wrap: anywhere; }
  .doc > p:first-of-type { font-size: 1.0625rem; max-width: 66ch; }
  strong { color: var(--ink); }
  code { font: .85em var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  pre { background: var(--code); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; display: block; overflow-x: auto; margin: 10px 0; }
  th { font-size: .75rem; letter-spacing: .02em; color: var(--ink-2); }
  th, td { border-bottom: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
  .summary span, .summary a { font: 600 .8125rem/1 var(--mono); color: var(--ink-2); background: var(--desk); border: 1px solid var(--rule); border-radius: 999px; padding: 8px 12px; text-decoration: none; }
  .summary .first { color: var(--teal-ink); border-color: color-mix(in oklab, var(--teal) 45%, var(--rule)); background: var(--wash); }
  ul.hyp { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  ul.hyp > li { background: var(--desk); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; margin: 0; }
  ul.hyp > li > strong:first-child { display: block; font: 700 .8125rem var(--mono); color: var(--teal-ink); margin-bottom: 2px; }
  .devbar { display: flex; justify-content: flex-end; margin: 0 0 6px; }
  button.all { font: 600 .8125rem var(--sans); color: var(--teal-ink); background: transparent; border: 1.5px solid var(--rule); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button.all:hover { border-color: var(--teal); }
  ul.devs { list-style: none; padding: 0; }
  ul.devs > li { margin: 0 0 10px; }
  details.dev { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
  details.dev[open] { background: color-mix(in oklab, var(--desk) 45%, var(--paper)); }
  details.dev > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; color: var(--ink); list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
  details.dev > summary::-webkit-details-marker { display: none; }
  details.dev > summary::after { content: "+"; font: 700 1rem/1 var(--mono); color: var(--teal-ink); }
  details.dev[open] > summary::after { content: "\2212"; }
  details.dev > summary .d { font: 700 .75rem var(--mono); color: var(--teal-ink); white-space: nowrap; }
  details.dev > div { padding: 0 16px 12px 16px; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 20px; }
    .toc { position: sticky; top: 0; z-index: 2; padding: 10px 0; background: var(--desk); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .toc .t { display: none; }
    .toc a { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; padding: 6px 10px; }
    .toc a.on { border-bottom-color: var(--teal); }
    .doc { padding: 22px 18px; }
  }

  /* plain: system type at ordinary sizes, no badges, no monospace labels */
  * { text-transform: none !important; letter-spacing: normal !important; }
  .eyebrow { font: 400 .9375rem/1.4 var(--sans); color: var(--ink-2); }
  h1 { font-size: 2rem; line-height: 1.25; font-weight: 700; max-width: none; }
  h2 { font-size: 1.375rem; line-height: 1.3; font-weight: 700; }
  h3 { font-size: 1.0625rem; }
  .lede { font-size: 1rem; }
  .chips { gap: 2px 18px; }
  .chips li, .chips.nots li { font: 400 .9375rem/1.5 var(--sans); color: var(--ink-2); background: none; border: 0; border-radius: 0; padding: 0; }
  .chips li.link a { font-weight: 400; text-decoration: underline; }
  .res .k { font: 600 .9375rem/1.3 var(--sans); color: var(--ink-2); }
  .res .big { font-size: 1.75rem; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="Contents"><p class="t">Contents</p></nav>
  <main>
    <p class="back"><a href="index.html">Results</a> · <a href="replay.html">Replay</a></p>
    <article class="doc" id="doc">
<!--__BODY__-->
    </article>
  </main>
</div>
<script>
(function () {
  const doc = document.getElementById("doc"), toc = document.getElementById("toc");
  const h2s = [...doc.querySelectorAll("h2")];
  const find = (re) => h2s.find((h) => re.test(h.textContent));
  const listAfter = (h) => { let n = h && h.nextElementSibling; while (n && n.tagName !== "UL" && n.tagName !== "H2") n = n.nextElementSibling; return n && n.tagName === "UL" ? n : null; };
  const dev = find(/^Deviations/), devList = listAfter(dev), expList = listAfter(find(/^Expectations/));
  const nDev = devList ? devList.children.length : 0, nExp = expList ? expList.children.length : 0;

  // What was registered, at a glance: the date from git, the arms from the harness, the rest counted here.
  const reg = "__REGISTERED__", arms = "__ARMS__";
  const chips = document.createElement("p"); chips.className = "summary";
  const add = (t, href, cls) => { const e = document.createElement(href ? "a" : "span"); e.textContent = t; if (href) e.href = href; if (cls) e.className = cls; chips.append(e); };
  if (/^\d{4}-\d{2}-\d{2}$/.test(reg)) add("Registered " + new Date(reg + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) + ", before the first run", null, "first");
  if (/^\d+$/.test(arms)) add(arms + " arms");
  if (nExp) add(nExp + " expectations, stated before the data");
  if (nDev) add(nDev + " deviations, each dated", "#" + (dev.id || ""));
  const lead = doc.querySelector("h1 + p"); if (lead) lead.after(chips); else doc.prepend(chips);

  if (expList) expList.classList.add("hyp");

  // Each deviation folds to its date and title; the reasoning opens on demand.
  if (devList) {
    devList.classList.add("devs");
    [...devList.children].forEach((li) => {
      const strong = li.querySelector(":scope > strong, :scope > p:first-child > strong");
      const title = (strong ? strong.textContent : li.textContent.slice(0, 90)).replace(/\s+/g, " ").trim().replace(/[.:]+$/, "");
      const m = title.match(/^(\d{1,2} \w+ \d{4})[,:]?\s*(.*)$/);
      const d = document.createElement("details"), s = document.createElement("summary"), body = document.createElement("div");
      d.className = "dev";
      const dd = document.createElement("span"); dd.className = "d"; dd.textContent = m ? m[1] : "";
      const tt = document.createElement("span"); const rest = m ? m[2] : title; tt.textContent = rest ? rest.charAt(0).toUpperCase() + rest.slice(1) : "";
      s.append(dd, tt);
      if (strong) { const p = strong.parentElement; strong.remove(); if (p !== li && !p.textContent.trim()) p.remove(); }
      while (li.firstChild) body.append(li.firstChild);
      d.append(s, body); li.append(d);
    });
    const bar = document.createElement("p"); bar.className = "devbar";
    const b = document.createElement("button"); b.type = "button"; b.className = "all"; b.textContent = "Open all";
    b.addEventListener("click", () => { const open = b.textContent === "Open all"; devList.querySelectorAll("details.dev").forEach((x) => { x.open = open; }); b.textContent = open ? "Close all" : "Open all"; });
    bar.append(b); devList.before(bar);
  }

  // Contents, marking the section in view.
  h2s.forEach((h) => {
    if (!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const a = document.createElement("a"); a.href = "#" + h.id; a.textContent = h.textContent.replace(/\s+/g, " ").replace(/,.*$/, "");
    if (h === dev && nDev) { const n = document.createElement("span"); n.className = "n"; n.textContent = nDev; a.append(n); }
    toc.append(a);
  });
  const links = [...toc.querySelectorAll("a")];
  try {
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) links.forEach((l) => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id));
    }), { rootMargin: "0px 0px -75% 0px" });
    h2s.forEach((h) => io.observe(h));
  } catch (e) { /* older browsers: the contents still link */ }
})();
</script>
</body>
</html>
